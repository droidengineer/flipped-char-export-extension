<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Flipped.Chat Character Exporter</title>
  <style>
    body {
      width: 340px;
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #e5e7eb;
      margin: 0;
      padding: 14px;
    }
    b {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 10px;
      color: #fff;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #extractBtn { background: #7c3aed; color: white; }
    #extractBtn:hover { background: #6d28d9; }
    #downloadBtn { background: #059669; color: white; display: none; }
    #downloadBtn:hover { background: #047857; }
    #downloadAllBtn { background: #059669; color: white; display: none; }
    #downloadAllBtn:hover { background: #047857; }
    #status { font-size: 12px; color: #9ca3af; min-height: 16px; margin-bottom: 8px; }
    #warnings {
      font-size: 11px;
      color: #fbbf24;
      background: #1f2937;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
      display: none;
      white-space: pre-wrap;
    }
    #version {
      font-size: 10px;
      color: #9ca3af;
      text-align: right;
      /*margin-bottom: 8px;*/
    }
    pre {
      background: #1f2937;
      border-radius: 8px;
      padding: 8px;
      font-size: 10px;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-link {
      color: #e5e7eb;
      text-decoration: none;
      cursor: pointer;
      font-weight: bold;
    }
    .dropdown-link:hover {
      color: #fbbf24;
    }
    .dropdown-content {
      display: none;
      position: relative;
      background-color: #1f2937;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }
    .dropdown-icon {
      color: #9ca3af;
      font-size: 14px;
    }
    .dropdown-item {
      color: #9ca3af;
      text-decoration: none;
      display: block;
      padding: 8px 16px;
      font-size: 12px;
    }
    .dropdown-item:hover {
      background-color: #374151;
      color: #fbbf24;
      cursor: pointer;
    }
    .dropdown-content.show {
      display: block;
    }
    .options {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      font-size: 10px;
    }
    .status-row {
      display: flex;
      flex-direction: row;
      font-size: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0;
    }
    .option-link {
      margin-left: 5px;
      color: #e5e7eb;
      font-size: 12px;
      display: none;

    }

  </style>
</head>
<body>
  <div class="dropdown">
    <b>Flipped.Chat → <a href="#" class="dropdown-link" id="dropdownLink">Character Card V2</a></b> <span class="dropdown-icon">✨ </span>
    <div class="dropdown-content" id="dropdownContent">
      <a href="#" class="dropdown-item" data-value=0>Flat JSON</a>
      <a href="#" class="dropdown-item" data-value=1>Character Card V1</a>
      <a href="#" class="dropdown-item" data-value=2 >Character Card V2</a>
      <a href="#" class="dropdown-item" data-value=3>Character Card V2-V1 Backfill</a>
    </div>
  </div>
  <div id="status">Open a flipped.chat character edit page, then click Extract.</div>
  <button id="extractBtn">Extract Character Data</button>
  <button id="downloadBtn">Download JSON</button>
  <button id="downloadAllBtn">Download All</button>
  <div id="warnings"></div>
  <pre id="preview"></pre>
  <div class="status-row">
    <a href="#" class="options" id="go-to-options">⚙️</a><span id="option-link"></span>
    <span id="version">v</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
