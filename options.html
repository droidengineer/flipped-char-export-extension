<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Extension Settings</title>
    <style>
        body {
            width: 120px;
            font-family: system-ui, sans-serif;
            color: #111827;
            /*background: #e5e7eb;*/
            margin: 0;
            padding: 14px 16px;
            box-sizing: border-box;
            position: relative;
        }
        b {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 10px;
            color: #111827;
        }
        input {
            width: 100%;
            padding: 9px 12px;
            border-radius: 8px;
            border: #111827;
            font-size: 12px;
            font-weight: 400;
            cursor: text;
            margin-bottom: 8px;
            background-color: #e5e7eb;

        }

        .creator:hover {
            background-color: #ffffff;
            border-radius: 8px;
            border: #111827;
            color: #111827;
        }

    </style>
</head>
<body>
<div>
    <label><b>Creator</b>
        <input type="text" class="creator" id="creator"></input>
    </label>
</div>

<div id="status"></div>
<button id="save">Save</button>
<script src="options.js"></script>

</body>
</html>
